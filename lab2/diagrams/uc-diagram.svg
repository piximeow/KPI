821.0003,130.1207,825.4815,133.573,822.0292,138.0542,830.44,132.93" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="694" y="120.0938">«extend»</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="135" x="656" y="135.8232">оплата [обрано card]</text><!--
@startuml uc-diagram
left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome

actor "Відвідувач" as V
actor "Клієнт" as C
actor "Менеджер магазину" as M
actor "Платіжний шлюз" as GW <<другорядний>>

C -up-|> V

rectangle "Онлайн-магазин" {
  usecase "UC1. Переглянути каталог" as UC1
  usecase UC2 as "UC2. Оформити замовлення
- -
точки розширення:
оплата"
  usecase "UC3. Вибрати адресу доставки" as UC3
  usecase "UC4. Оплатити карткою" as UC4
  usecase "UC5. Переглянути статус замовлення" as UC5
  usecase "UC6. Опрацювати замовлення" as UC6
}

V - -> UC1
C - -> UC2
C - -> UC5
M - -> UC6
UC4 - - GW

UC2 ..> UC3 : <<include>>
UC4 ..> UC2 : <<extend>>\nоплата [обрано card]
@enduml

