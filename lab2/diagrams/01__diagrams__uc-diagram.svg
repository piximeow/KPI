54 583,471 C605.44,454.23 632.63,441.44 658.97,431.83 " fill="none" id="UC7-UC5" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="663.88,430.08,654.0587,429.3438,659.1719,431.7635,656.7523,436.8767,663.88,430.08" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="414" y="713.0938">«extend»</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="162" x="362.5" y="728.8232">[обрано оплату карткою]</text><!--link UC7 to UC9--><path d="M655.05,1107.5 C557.84,1085.03 421.27,1035.32 365,928.5 C301.92,808.75 491.07,741.5 629.56,709.28 " fill="none" id="UC7-UC9" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="634.47,708.15,624.7994,706.2845,629.599,709.2785,626.605,714.078,634.47,708.15" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="414" y="909.0938">«extend»</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="261" x="313" y="924.8232">[замовлення new, оплата не succeeded]</text><!--link Gateway to UC7--><path d="M281.53,1125 C367.09,1125 514.38,1125 623.2,1125 " fill="none" id="Gateway-UC7" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="628.35,1125,619.35,1121,623.35,1125,619.35,1129,628.35,1125" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml uc-diagram
left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome
skinparam usecase {
  BackgroundColor<<обраний>> #FFF2CC
  BorderColor<<обраний>> #B8860B
}

actor "Відвідувач" as Visitor
actor "Гість" as Guest
actor "Клієнт" as Client
actor "Менеджер магазину" as Manager
actor "Платіжний шлюз" as Gateway <<зовнішня система>>

Visitor <|- - Guest
Visitor <|- - Client

rectangle "Онлайн-магазин" {
  usecase "UC1 Переглянути каталог" as UC1
  usecase "UC2 Знайти товар за назвою" as UC2
  usecase "UC3 Сформувати кошик" as UC3
  usecase "UC4 Зареєструватися" as UC4
  usecase "UC5 Оформити замовлення\n- -\nточки розширення:\nвибір способу оплати" as UC5 <<обраний>>
  usecase "UC6 Вказати адресу доставки" as UC6
  usecase "UC7 Оплатити замовлення карткою" as UC7
  usecase "UC8 Керувати адресами" as UC8
  usecase "UC9 Переглянути свої замовлення\n- -\nточки розширення:\nнеоплачене замовлення" as UC9
  usecase "UC10 Залишити відгук на товар" as UC10
  usecase "UC11 Керувати каталогом" as UC11
  usecase "UC12 Опрацювати замовлення" as UC12
}

Visitor - -> UC1
Visitor - -> UC3
Visitor - -> UC5
Guest - -> UC4
Client - -> UC8
Client - -> UC9
Client - -> UC10
Manager - -> UC11
Manager - -> UC12

UC2 .> UC1 : <<extend>>\n[введено пошуковий запит]
UC5 .> UC6 : <<include>>
UC8 .> UC6 : <<include>>
UC7 .> UC5 : <<extend>>\n[обрано оплату карткою]
UC7 .> UC9 : <<extend>>\n[замовлення new, оплата не succeeded]

Gateway - -> UC7
@enduml

