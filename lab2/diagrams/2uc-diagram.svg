 C411.96,277.64 510.76,286.31 588.2,293.1 " fill="none" id="UC4-UC2" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="593.27,293.55,584.6468,288.7918,588.2885,293.1206,583.9597,296.7622,593.27,293.55" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="461" y="260.2938">«extend»</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="135" x="423" y="276.0232">оплата [обрано card]</text><!--
@startuml uc-diagram
left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome

actor "Клієнт" as C
actor "Платіжний шлюз" as GW <<другорядний>>

rectangle "Онлайн-магазин" {
  usecase "UC1. Переглянути каталог" as UC1
  usecase UC2 as "UC2. Оформити замовлення
- -
точки розширення:
оплата"
  usecase "UC3. Вибрати адресу доставки" as UC3
  usecase "UC4. Оплатити карткою" as UC4
  usecase "UC5. Переглянути статус замовлення" as UC5
}

C - -> UC1
C - -> UC2
C - -> UC5
UC4 - - GW

UC2 ..> UC3 : <<include>>
UC4 ..> UC2 : <<extend>>\nоплата [обрано card]
@enduml

